# Risk register templates (vCISO workspace). Likelihood/impact 1-5; score = L x I.
templates:
  - {title: Compromised privileged account, category: Privileged Access, likelihood: 3, impact: 5, treatment: Mitigate, treatment_plan: "Reduce standing admin accounts, enforce phishing-resistant MFA for admins, alert on privileged sign-ins.", controls: [A.8.2, A.8.5, PR.AA]}
  - {title: Account takeover via phishing, category: Access & Identity, likelihood: 4, impact: 4, treatment: Mitigate, treatment_plan: "Enforce MFA for all users, block legacy authentication, run awareness refreshers.", controls: [A.5.17, A.8.5, PR.AA]}
  - {title: Orphaned leaver or guest access, category: Access & Identity, likelihood: 3, impact: 3, treatment: Mitigate, treatment_plan: "Automate offboarding from HR trigger; quarterly guest access review.", controls: [A.5.16, A.5.18, ID.AM]}
  - {title: Secrets committed to source code, category: Application & Code, likelihood: 3, impact: 4, treatment: Mitigate, treatment_plan: "Enable secret scanning with push protection; rotate exposed credentials; use a secrets manager.", controls: [A.8.24, PR.DS]}
  - {title: Vulnerable third-party dependencies, category: Application & Code, likelihood: 4, impact: 3, treatment: Mitigate, treatment_plan: "Enable Dependabot security updates and set SLA for critical/high fixes.", controls: [A.8.8, DE.CM]}
  - {title: Ransomware or data loss without tested restore, category: Operational Continuity, likelihood: 2, impact: 5, treatment: Mitigate, treatment_plan: "Immutable off-account backups and quarterly restore tests.", controls: [A.8.13, RC.RP]}
  - {title: Over-permissive third-party SaaS app, category: Governance & Third-Party, likelihood: 3, impact: 4, treatment: Mitigate, treatment_plan: "Restrict OAuth app consent; review high-risk scopes; supplier security assessment.", controls: [A.5.19, A.5.21, GV.SC]}
  - {title: Incident not detected in time, category: Infrastructure & Data, likelihood: 3, impact: 4, treatment: Mitigate, treatment_plan: "Centralise audit logs, define alerting for high-risk events, rehearse incident response.", controls: [A.8.15, A.8.16, DE.CM, RS.MA]}
  - {title: Key supplier outage, category: Governance & Third-Party, likelihood: 2, impact: 4, treatment: Transfer, treatment_plan: "Contractual SLAs, documented fallback procedures, cyber insurance review.", controls: [A.5.22, GV.SC]}
