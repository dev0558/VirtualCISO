[project]
name = "vciso-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "pyjwt>=2.8",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "qrcode>=7.4",
  "cryptography>=42",
  "pgvector>=0.3",
  "celery[redis]>=5.4",
  "redis>=5.0",
  "boto3>=1.34",
  "anthropic>=0.60",
  "openpyxl>=3.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "jinja2>=3.1",
  "weasyprint>=62",
  "vciso-connectors",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "ruff>=0.5", "pip-audit>=2.7"]

[tool.uv.sources]
vciso-connectors = { path = "../../packages/connectors", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vciso_api"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["S101", "B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106", "S603"]
